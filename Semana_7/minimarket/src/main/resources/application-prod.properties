# Configuración de persistencia real para producción
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minimarket_prod}
spring.datasource.username=${DB_USER:dbadmin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Secreto JWT inyectado externamente de forma obligatoria
security.jwt.secret=${JWT_SECRET}